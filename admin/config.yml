# Decap CMS — édition des copy decks EMASPHERE (texte seul, aucun accès au design).
# À ACTIVER : créer une GitHub OAuth App + un proxy OAuth (Cloudflare Worker) et renseigner base_url.
backend:
  name: github
  repo: gcoche-bit/emasphere-rebranding-2026
  branch: main
  base_url: https://A-RENSEIGNER.workers.dev   # proxy OAuth (docs/29)
  auth_endpoint: auth
  commit_messages:
    create: "Contenu : {{collection}} « {{slug}} » créé"
    update: "Contenu : {{collection}} « {{slug}} » modifié"
    delete: "Contenu : {{collection}} « {{slug}} » supprimé"
publish_mode: editorial_workflow     # Brouillon → En relecture → Prêt : chaque texte passe par une pull request
locale: fr
site_url: https://gcoche-bit.github.io/emasphere-site-preview/
display_url: https://gcoche-bit.github.io/emasphere-site-preview/
media_folder: hubspot-theme/images/contenu
public_folder: /hubspot-theme/images/contenu
collections:
  - name: pages-fr
    label: "Pages — texte français"
    label_singular: "Page"
    folder: content
    path: "{{slug}}/fr"
    extension: md
    format: frontmatter
    create: false
    delete: false
    nested: { depth: 1 }
    summary: "{{page}} — {{status}}"
    editor: { preview: false }        # pas d'aperçu design : on édite le texte, la page est générée ensuite
    fields:
      - { name: page, label: Identifiant de page, widget: string, hint: "Ne pas modifier." }
      - { name: lang, label: Langue, widget: hidden, default: fr }
      - { name: status, label: Statut, widget: select, options: [draft, review, final], hint: "final = publiable (plus aucun [PROPOSITION])." }
      - { name: source, label: Source, widget: string, required: false }
      - { name: body, label: "Copy deck", widget: markdown, buttons: [bold, italic, bulleted-list, numbered-list, link], editor_components: [], hint: "Ne touchez pas aux lignes « ## [bloc] », « **Kicker** », « Écran : », « Lien : », « Disposition : ». Marque : EMASPHERE." }
